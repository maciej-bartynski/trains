<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test page</title>
    <script type="importmap">
    {
        "imports": {
            "#src/": "./dist/"
        }
    }
    </script>
    <script src="./dist/new-src/index.js" type="module"></script>
    <script src="./dist/new-src/debuging/run.js" type="module"></script>
    <style>
        * {
            tab-size: 4;
        }

        /* CSS Custom Properties - łatwe do zmiany */
        :root {
            --debg-indent-size: 20px;
            /* odpowiada INDENT_SIZE w run.ts */
            --debg-font-size: 14px;
            /* odpowiada FONT_SIZE w run.ts */
        }

        /* Stylowanie elementów debuggera */
        debg-block {
            display: block;
            width: 100%;
            margin-bottom: 20px;
            font-size: var(--debg-font-size);
            font-family: monospace;
        }

        debg-line {
            display: flex;
            white-space: pre-wrap;
            width: 100%;
            font-size: var(--debg-font-size);
            font-family: monospace;
        }

        .debg-content {
            flex: 1;
        }

        .debg-children {
            width: 100%;
        }

        .debg-toggle {
            display: inline-block;
            width: 20px;
            height: 14px;
            padding: 0;
            margin: 0;
            border: 1px solid #ccc;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 12px;
            line-height: 12px;
            text-align: center;
            user-select: none;
        }

        .debg-toggle:hover {
            background: #e0e0e0;
        }

        /* Klasy kolorowania */
        .debg-key {
            font-weight: bold;
        }

        .debg-brace {
            color: blue;
        }

        .debg-number {
            color: green;
        }

        .debg-string {
            /* normalny kolor - domyślny */
        }

        .debg-null {
            color: #0066cc;
        }
    </style>

    <style>
        f-block {
            display: block;
            width: 100%;
        }

        f-open-line,
        f-close-line,
        f-line {
            display: block;
            width: 100%;
            background-color: #ccc;
            margin-bottom: 1px;
            font-size: 12px;
            line-height: 16px;
            height: 16px;
        }

        f-open-line:hover,
        f-close-line:hover,
        f-line:hover {
            background-color: #ffffff;
        }


        f-toggle {
            display: inline-flex;
            width: 20px;
            height: 12px;
            background-color: bisque;
            cursor: pointer;
            user-select: none;
            justify-content: center;
            align-items: center;
        }

        f-space {
            display: inline-block;
            width: 20px;
            height: 12px;
            background-color: azure;
            user-select: none;
            opacity: 0;
        }

        f-text {
            color: green;
            font-size: 11px;
            font-family: sans-serif;
        }

        f-block .value-nullable {
            color: blue;
        }

        f-block .value-number {
            color: chocolate;
        }

        f-block .value-string {
            color: grey;
        }

        f-block .value-true {
            color: gold;
        }

        f-block .value-false {
            color: blue
        }

        f-block .key-number {
            color: rgb(42, 120, 165);
            font-weight: bold;
            font-family: sans-serif;
        }

        f-block .key-string {
            color: rgba(42, 120, 165, .7);
            font-weight: 600;
            font-family: sans-serif;
        }

        f-block .mark {
            color: rgb(15, 49, 68);
            font-weight: bold;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <div>
        this is game testing page
    </div>
</body>

</html>
